<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <div class="search-section">
            <h2>Find & Manage Student</h2>
            <div class="search-group">
                <input type="number" id="searchId" placeholder="Enter Student ID" min="1">
                <button id="searchBtn" onclick="searchStudent()">Search</button>
                <button id="listBtn" onclick="listAllStudents()">List All</button>
            </div>
        </div>
        
        <div class="form-section">
            <h2>Add/Edit Student</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="major">Major:</label>
                    <input type="text" id="major" required>
                </div>
                
                <div class="form-group">
                    <label for="gpa">GPA:</label>
                    <input type="number" id="gpa" min="0" max="4" step="0.01" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="deleteBtn" onclick="deleteFromForm()" style="display:none;">Delete Student</button>
                    <button type="reset" id="resetBtn">Clear Form</button>
                </div>
            </form>
        </div>
        
        <div class="list-section" id="listSection" style="display:none;">
            <h2>Student List</h2>
            <div class="table-container">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Major</th>
                            <th>GPA</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <button id="hideListBtn" onclick="hideStudentList()" style="margin-top: 20px;">Hide List</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
