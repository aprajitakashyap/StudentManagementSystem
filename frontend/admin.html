<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #2d2d2d;
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
        }

        .query-box {
            background: #1e1e1e;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #1e1e1e;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        button {
            background: #00ff00;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 10px;
        }

        button:hover {
            background: #00cc00;
        }

        .output {
            background: #1e1e1e;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #00ff00;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #1e1e1e;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background: rgba(0, 255, 0, 0.05);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #1e1e1e;
            border: 1px solid #00ff00;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #00ff00;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ Database Admin Console</h1>
        
        <div class="stats" id="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="avgGpa">0.00</div>
                <div class="stat-label">Average GPA</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="maxGpa">0.00</div>
                <div class="stat-label">Max GPA</div>
            </div>
        </div>

        <button onclick="loadAllStudents()" style="background: #00ff00; width: 100%; padding: 12px;">📊 Load All Students</button>

        <div id="tableContainer"></div>

        <div class="query-box">
            <h3>🔍 Custom Query</h3>
            <textarea id="queryInput" placeholder="SELECT * FROM students; or any other SQL query..."></textarea>
            <button onclick="executeQuery()">Execute Query</button>
        </div>

        <div class="output" id="output" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8089/api/students';

        // Load all students on page load
        document.addEventListener('DOMContentLoaded', loadAllStudents);

        async function loadAllStudents() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to load students');

                const students = await response.json();
                displayStats(students);
                displayTable(students);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function displayStats(students) {
            document.getElementById('totalStudents').textContent = students.length;

            if (students.length > 0) {
                const gpas = students.map(s => parseFloat(s.gpa));
                const avgGpa = (gpas.reduce((a, b) => a + b, 0) / gpas.length).toFixed(2);
                const maxGpa = Math.max(...gpas).toFixed(2);

                document.getElementById('avgGpa').textContent = avgGpa;
                document.getElementById('maxGpa').textContent = maxGpa;
            }
        }

        function displayTable(students) {
            let html = '<table><thead><tr>';
            html += '<th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Major</th><th>GPA</th>';
            html += '</tr></thead><tbody>';

            students.forEach(student => {
                html += '<tr>';
                html += `<td>${student.id}</td>`;
                html += `<td>${student.name}</td>`;
                html += `<td>${student.email}</td>`;
                html += `<td>${student.phone}</td>`;
                html += `<td>${student.major}</td>`;
                html += `<td>${parseFloat(student.gpa).toFixed(2)}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function executeQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                alert('Please enter a query');
                return;
            }

            const output = document.getElementById('output');
            output.innerHTML = '⏳ Executing query...\n\nQuery:\n' + query;
            output.style.display = 'block';

            // For now, show instructions since we're using REST API
            setTimeout(() => {
                output.innerHTML = '📝 Query Interface:\n\n' +
                    'Since we\'re using a REST API, here are common queries:\n\n' +
                    '1. GET ALL STUDENTS:\n' +
                    'Use: "SELECT * FROM students;"  -> Click "Load All Students" button\n\n' +
                    '2. GET BY ID (replace 1 with student id):\n' +
                    'fetch("http://localhost:8080/api/students/1")\n\n' +
                    '3. INSERT NEW STUDENT:\n' +
                    'POST to http://localhost:8080/api/students with:\n' +
                    '{"name":"John","email":"john@email.com","phone":"555-1234","major":"CS","gpa":3.9}\n\n' +
                    '4. UPDATE STUDENT:\n' +
                    'PUT to http://localhost:8080/api/students/1 with updated data\n\n' +
                    '5. DELETE STUDENT:\n' +
                    'DELETE http://localhost:8080/api/students/1\n\n' +
                    '✅ Or use the Student Management System UI to manage data!';
            }, 500);
        }
    </script>
</body>
</html>
